<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HandMade Crochet - Premium Luxury Handicraft Store</title>
  
  <!-- Global Error Handler for Debugging -->
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      const root = document.getElementById('app-root');
      if (root) {
        root.innerHTML = `
          <div style="padding: 2rem; background: #fee2e2; color: #991b1b; border: 1px solid #f87171; border-radius: 8px; font-family: monospace; max-width: 800px; margin: 2rem auto; direction: ltr; text-align: left;">
            <h2 style="margin-bottom: 0.5rem;">🚨 Application Error</h2>
            <p><strong>Error:</strong> ${message}</p>
            <p><strong>Source:</strong> ${source}</p>
            <p><strong>Line:</strong> ${lineno} | <strong>Column:</strong> ${colno}</p>
            ${error && error.stack ? `<pre style="margin-top: 1rem; background: #fff; padding: 1rem; border-radius: 4px; overflow-x: auto;">${error.stack}</pre>` : ''}
          </div>
        `;
      }
      return false;
    };
  </script>

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Root mount element -->
  <div id="app-root"></div>

  <!-- Router and Bootstrap Module -->
  <script type="module">
    import { Storefront } from './js/storefront.js';
    import { Admin } from './js/admin.js';

    let currentInstance = null;

    function router() {
      const hash = window.location.hash || '#home';
      
      // Clean up previous view instance
      if (currentInstance && typeof currentInstance.destroy === 'function') {
        currentInstance.destroy();
      }
      
      const root = document.getElementById('app-root');
      if (root) root.innerHTML = '';

      if (hash.startsWith('#home') || hash === '#' || hash === '') {
        currentInstance = new Storefront('app-root');
      } else if (hash.startsWith('#admin')) {
        currentInstance = new Admin('app-root');
      } else if (hash.startsWith('#editor')) {
        // visual customizer route inside admin dashboard
        currentInstance = new Admin('app-root');
        currentInstance.activeTab = 'customizer';
        currentInstance.render();
      } else {
        // For other shop views (#shop, #details, #custom, #gallery, #blog, #about, #contact)
        currentInstance = new Storefront('app-root');
      }
    }

    // Bind hash change listener
    window.addEventListener('hashchange', router);
    
    // Initial router execution on page load
    window.addEventListener('DOMContentLoaded', router);
  </script>

</body>
</html>
